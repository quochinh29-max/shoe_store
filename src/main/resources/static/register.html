<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Đăng ký tài khoản - Quản lý cửa hàng giày Shoe Store">
    <title>Đăng ký - Shoe Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">👟</div>
                <h1 class="auth-title">Tạo tài khoản</h1>
                <p class="auth-subtitle">Đăng ký để bắt đầu quản lý cửa hàng</p>
            </div>

            <div id="registerAlert" class="alert"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="regFullName">Họ và tên</label>
                    <input type="text" id="regFullName" class="form-input"
                           placeholder="Nguyễn Văn A" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regUsername">Tên đăng nhập</label>
                    <input type="text" id="regUsername" class="form-input"
                           placeholder="username123" required minlength="3" maxlength="50">
                </div>

                <div class="form-group">
                    <label class="form-label" for="regEmail">Email</label>
                    <input type="email" id="regEmail" class="form-input"
                           placeholder="email@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regPassword">Mật khẩu</label>
                    <input type="password" id="regPassword" class="form-input"
                           placeholder="Tối thiểu 6 ký tự" required minlength="6">
                </div>

                <button type="submit" class="btn btn-primary btn-block">📝 Đăng ký</button>
            </form>

            <p class="text-center mt-1 text-muted">
                Đã có tài khoản? <a href="login.html">Đăng nhập</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
