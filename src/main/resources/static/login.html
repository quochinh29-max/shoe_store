<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Đăng nhập - Quản lý cửa hàng giày Shoe Store">
    <title>Đăng nhập - Shoe Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">👟</div>
                <h1 class="auth-title">Shoe Store</h1>
                <p class="auth-subtitle">Đăng nhập vào hệ thống quản lý</p>
            </div>

            <div id="loginAlert" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="loginUsername">Tên đăng nhập</label>
                    <input type="text" id="loginUsername" class="form-input"
                           placeholder="Nhập tên đăng nhập" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">Mật khẩu</label>
                    <input type="password" id="loginPassword" class="form-input"
                           placeholder="Nhập mật khẩu" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-block">🔐 Đăng nhập</button>
            </form>

            <p class="text-center mt-1 text-muted">
                Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
