<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Đăng ký - Shoe Store Management">
  <title>Đăng ký - Shoe Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <div class="auth-layout">

    <!-- ─── Left Illustration ─── -->
    <div class="auth-illustration">
      <div class="auth-logo-header">
        <div class="auth-logo-icon-wrap">👟</div>
        <div>
          <div class="auth-logo-title">Shoe Store</div>
          <div class="auth-logo-sub">Management System</div>
        </div>
      </div>

      <div class="auth-svg-wrap">
        <svg viewBox="0 0 640 460" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
          <defs>
            <linearGradient id="mtnA2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#A5BEF0" />
              <stop offset="100%" stop-color="#C5D8FF" />
            </linearGradient>
            <linearGradient id="mtnB2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#8AAEE0" />
              <stop offset="100%" stop-color="#B5CCFF" />
            </linearGradient>
            <linearGradient id="mtnC2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#7099CC" />
              <stop offset="100%" stop-color="#A0BDEE" />
            </linearGradient>
            <linearGradient id="gnd2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#A8D5A2" />
              <stop offset="100%" stop-color="#7EB87A" />
            </linearGradient>
            <linearGradient id="bal2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FF9F7B" />
              <stop offset="40%" stop-color="#FFBFA0" />
              <stop offset="100%" stop-color="#FF9F7B" />
            </linearGradient>
          </defs>
          <path d="M0 300 L70 180 L140 240 L210 150 L290 220 L370 130 L450 200 L530 120 L640 190 L640 460 L0 460Z"
            fill="url(#mtnA2)" opacity="0.55" />
          <path d="M210 150 L230 175 L190 175Z" fill="white" opacity="0.6" />
          <path d="M370 130 L393 158 L347 158Z" fill="white" opacity="0.55" />
          <path d="M-10 330 L80 195 L170 268 L265 155 L360 245 L455 165 L550 235 L640 170 L640 460 L-10 460Z"
            fill="url(#mtnB2)" opacity="0.72" />
          <path d="M265 155 L290 188 L240 188Z" fill="white" opacity="0.5" />
          <path d="M0 380 L90 280 L185 345 L290 260 L395 330 L490 265 L590 320 L640 295 L640 460 L0 460Z"
            fill="url(#mtnC2)" opacity="0.85" />
          <path d="M0 415 Q160 398 320 410 Q480 422 640 405 L640 460 L0 460Z" fill="url(#gnd2)" opacity="0.95" />
          <path d="M165 460 Q210 438 255 420 Q300 402 330 384 Q360 366 380 342" stroke="#90C4FF" stroke-width="22"
            fill="none" stroke-linecap="round" opacity="0.7" />
          <path d="M165 460 Q210 438 255 420 Q300 402 330 384 Q360 366 380 342" stroke="white" stroke-width="8"
            fill="none" stroke-linecap="round" opacity="0.35" />
          <!-- Trees left -->
          <g transform="translate(35,350)">
            <rect x="14" y="54" width="8" height="22" fill="#5C4033" rx="2" />
            <polygon points="18,0 -2,55 38,55" fill="#5B9B6B" />
            <polygon points="18,22 -4,60 40,60" fill="#4A8B5A" />
          </g>
          <g transform="translate(72,342)">
            <rect x="12" y="49" width="7" height="20" fill="#5C4033" rx="2" />
            <polygon points="16,0 -2,50 34,50" fill="#6BAB7B" />
            <polygon points="16,20 -3,56 35,56" fill="#5B9B6B" />
          </g>
          <g transform="translate(10,365)">
            <rect x="11" y="42" width="7" height="15" fill="#5C4033" rx="2" />
            <polygon points="14,0 -1,42 29,42" fill="#4A8B5A" />
            <polygon points="14,18 -2,48 30,48" fill="#3A7B4A" />
          </g>
          <!-- Trees right -->
          <g transform="translate(540,348)">
            <rect x="14" y="52" width="8" height="22" fill="#5C4033" rx="2" />
            <polygon points="18,0 -2,52 38,52" fill="#5B9B6B" />
            <polygon points="18,22 -4,58 40,58" fill="#4A8B5A" />
          </g>
          <g transform="translate(578,355)">
            <rect x="12" y="47" width="7" height="18" fill="#5C4033" rx="2" />
            <polygon points="16,0 -2,48 34,48" fill="#6BAB7B" />
            <polygon points="16,20 -3,54 35,54" fill="#5B9B6B" />
          </g>
          <!-- Balloon orange -->
          <g class="float-anim" transform="translate(390,75)">
            <line x1="18" y1="88" x2="26" y2="105" stroke="#7C65A8" stroke-width="1.5" opacity="0.7" />
            <line x1="60" y1="88" x2="52" y2="105" stroke="#7C65A8" stroke-width="1.5" opacity="0.7" />
            <rect x="18" y="105" width="38" height="20" rx="4" fill="#8B6914" opacity="0.9" />
            <rect x="21" y="108" width="32" height="14" rx="3" fill="#A07820" opacity="0.8" />
            <ellipse cx="38" cy="47" rx="37" ry="44" fill="url(#bal2)" />
            <path d="M2 47 Q38 30 74 47" stroke="white" stroke-width="2" fill="none" opacity="0.3"
              stroke-linecap="round" />
            <line x1="38" y1="3" x2="38" y2="91" stroke="white" stroke-width="1.5" opacity="0.2" />
          </g>
          <!-- Clouds -->
          <g opacity="0.75">
            <ellipse cx="100" cy="70" rx="55" ry="18" fill="white" />
            <ellipse cx="120" cy="64" rx="36" ry="16" fill="white" />
          </g>
          <g opacity="0.6">
            <ellipse cx="490" cy="55" rx="50" ry="17" fill="white" />
            <ellipse cx="510" cy="49" rx="32" ry="14" fill="white" />
          </g>
          <g stroke="#6B8ECC" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.65">
            <path d="M250 120 Q256 114 262 120" />
            <path d="M268 112 Q274 106 280 112" />
          </g>
        </svg>
      </div>
    </div>

    <!-- ─── Right Form Panel ─── -->
    <div class="auth-panel">
      <div class="auth-form-wrap">
        <div class="auth-user-icon">📝</div>
        <h1 class="auth-title">Tạo tài khoản</h1>
        <p class="auth-subtitle">Đăng ký để bắt đầu quản lý cửa hàng của bạn</p>

        <div id="registerAlert" class="alert"></div>

        <form id="registerForm">
          <div class="auth-input-wrap">
            <span class="auth-input-icon">👤</span>
            <input type="text" id="regFullName" class="form-input-auth" placeholder="Họ và tên" required>
          </div>

          <div class="auth-input-wrap">
            <span class="auth-input-icon">🔑</span>
            <input type="text" id="regUsername" class="form-input-auth" placeholder="Tên đăng nhập (tối thiểu 3 ký tự)"
              required minlength="3" maxlength="50">
          </div>

          <div class="auth-input-wrap">
            <span class="auth-input-icon">✉️</span>
            <input type="email" id="regEmail" class="form-input-auth" placeholder="Địa chỉ email" required>
          </div>

          <div class="auth-input-wrap">
            <span class="auth-input-icon">🔒</span>
            <input type="password" id="regPassword" class="form-input-auth" placeholder="Mật khẩu (tối thiểu 6 ký tự)"
              required minlength="6">
          </div>

          <button type="submit" class="btn-auth" id="registerSubmitBtn" style="margin-top:6px;">Đăng ký</button>
        </form>

        <div class="auth-footer-link">
          Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
        </div>
      </div>

      <div class="auth-copyright">© 2025 Shoe Store Management System</div>
    </div>

  </div>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
</body>

</html>
