<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Đăng nhập - Shoe Store Management">
  <title>Đăng nhập - Shoe Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="auth-layout">

  <!-- ─── Left Illustration ─── -->
  <div class="auth-illustration">
    <!-- Logo header -->
    <div class="auth-logo-header">
      <div class="auth-logo-icon-wrap">👟</div>
      <div>
        <div class="auth-logo-title">Shoe Store</div>
        <div class="auth-logo-sub">Management System</div>
      </div>
    </div>

    <!-- SVG Illustration -->
    <div class="auth-svg-wrap">
      <svg viewBox="0 0 640 460" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
        <defs>
          <linearGradient id="mtnA" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A5BEF0"/><stop offset="100%" stop-color="#C5D8FF"/></linearGradient>
          <linearGradient id="mtnB" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8AAEE0"/><stop offset="100%" stop-color="#B5CCFF"/></linearGradient>
          <linearGradient id="mtnC" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7099CC"/><stop offset="100%" stop-color="#A0BDEE"/></linearGradient>
          <linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A8D5A2"/><stop offset="100%" stop-color="#7EB87A"/></linearGradient>
          <linearGradient id="rvr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#90C4FF"/><stop offset="100%" stop-color="#B8D8FF"/></linearGradient>
          <linearGradient id="bal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7B9FFF"/><stop offset="40%" stop-color="#A0BFFF"/><stop offset="100%" stop-color="#7B9FFF"/></linearGradient>
        </defs>

        <!-- Far mountains -->
        <path d="M0 300 L70 180 L140 240 L210 150 L290 220 L370 130 L450 200 L530 120 L640 190 L640 460 L0 460Z" fill="url(#mtnA)" opacity="0.55"/>
        <!-- Snow caps -->
        <path d="M210 150 L230 175 L190 175Z" fill="white" opacity="0.6"/>
        <path d="M370 130 L393 158 L347 158Z" fill="white" opacity="0.55"/>
        <path d="M530 120 L554 150 L506 150Z" fill="white" opacity="0.5"/>

        <!-- Mid mountains -->
        <path d="M-10 330 L80 195 L170 268 L265 155 L360 245 L455 165 L550 235 L640 170 L640 460 L-10 460Z" fill="url(#mtnB)" opacity="0.72"/>
        <!-- Snow on mid -->
        <path d="M265 155 L290 188 L240 188Z" fill="white" opacity="0.5"/>
        <path d="M455 165 L478 194 L432 194Z" fill="white" opacity="0.45"/>

        <!-- Close hills -->
        <path d="M0 380 L90 280 L185 345 L290 260 L395 330 L490 265 L590 320 L640 295 L640 460 L0 460Z" fill="url(#mtnC)" opacity="0.85"/>

        <!-- Ground -->
        <path d="M0 415 Q160 398 320 410 Q480 422 640 405 L640 460 L0 460Z" fill="url(#gnd)" opacity="0.95"/>

        <!-- River -->
        <path d="M165 460 Q210 438 255 420 Q300 402 330 384 Q360 366 380 342" stroke="url(#rvr)" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.7"/>
        <path d="M165 460 Q210 438 255 420 Q300 402 330 384 Q360 366 380 342" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.35"/>

        <!-- Trees left -->
        <g transform="translate(35,350)">
          <rect x="14" y="54" width="8" height="22" fill="#5C4033" rx="2"/>
          <polygon points="18,0 -2,55 38,55" fill="#5B9B6B"/>
          <polygon points="18,22 -4,60 40,60" fill="#4A8B5A"/>
        </g>
        <g transform="translate(72,342)">
          <rect x="12" y="49" width="7" height="20" fill="#5C4033" rx="2"/>
          <polygon points="16,0 -2,50 34,50" fill="#6BAB7B"/>
          <polygon points="16,20 -3,56 35,56" fill="#5B9B6B"/>
        </g>
        <g transform="translate(10,365)">
          <rect x="11" y="42" width="7" height="15" fill="#5C4033" rx="2"/>
          <polygon points="14,0 -1,42 29,42" fill="#4A8B5A"/>
          <polygon points="14,18 -2,48 30,48" fill="#3A7B4A"/>
        </g>

        <!-- Trees right -->
        <g transform="translate(540,348)">
          <rect x="14" y="52" width="8" height="22" fill="#5C4033" rx="2"/>
          <polygon points="18,0 -2,52 38,52" fill="#5B9B6B"/>
          <polygon points="18,22 -4,58 40,58" fill="#4A8B5A"/>
        </g>
        <g transform="translate(578,355)">
          <rect x="12" y="47" width="7" height="18" fill="#5C4033" rx="2"/>
          <polygon points="16,0 -2,48 34,48" fill="#6BAB7B"/>
          <polygon points="16,20 -3,54 35,54" fill="#5B9B6B"/>
        </g>
        <g transform="translate(510,368)">
          <rect x="11" y="38" width="7" height="14" fill="#5C4033" rx="2"/>
          <polygon points="14,0 -1,38 29,38" fill="#4A8B5A"/>
          <polygon points="14,16 -2,44 30,44" fill="#3A7B4A"/>
        </g>

        <!-- Hot air balloon (animated) -->
        <g class="float-anim" transform="translate(195,80)">
          <!-- Rope lines -->
          <line x1="18" y1="96" x2="26" y2="113" stroke="#7C65A8" stroke-width="1.5" opacity="0.7"/>
          <line x1="62" y1="96" x2="54" y2="113" stroke="#7C65A8" stroke-width="1.5" opacity="0.7"/>
          <line x1="8"  y1="78" x2="24" y2="113" stroke="#7C65A8" stroke-width="1.5" opacity="0.6"/>
          <line x1="72" y1="78" x2="56" y2="113" stroke="#7C65A8" stroke-width="1.5" opacity="0.6"/>
          <!-- Basket -->
          <rect x="20" y="113" width="40" height="23" rx="5" fill="#8B6914" opacity="0.9"/>
          <rect x="23" y="116" width="34" height="17" rx="4" fill="#A07820" opacity="0.8"/>
          <!-- Balloon body -->
          <ellipse cx="40" cy="52" rx="40" ry="48" fill="url(#bal)"/>
          <!-- Stripe accents -->
          <path d="M2 52 Q40 34 78 52" stroke="white" stroke-width="2.5" fill="none" opacity="0.35" stroke-linecap="round"/>
          <path d="M5 64 Q40 46 75 64" stroke="white" stroke-width="2"   fill="none" opacity="0.25" stroke-linecap="round"/>
          <path d="M5 40 Q40 58 75 40" stroke="white" stroke-width="2.5" fill="none" opacity="0.3"  stroke-linecap="round"/>
          <!-- Center line -->
          <line x1="40" y1="4" x2="40" y2="100" stroke="white" stroke-width="1.5" opacity="0.2"/>
        </g>

        <!-- Clouds -->
        <g opacity="0.75">
          <ellipse cx="100" cy="70"  rx="55" ry="18" fill="white"/>
          <ellipse cx="120" cy="64"  rx="36" ry="16" fill="white"/>
          <ellipse cx="80"  cy="73"  rx="30" ry="13" fill="white"/>
        </g>
        <g opacity="0.6">
          <ellipse cx="490" cy="55"  rx="50" ry="17" fill="white"/>
          <ellipse cx="510" cy="49"  rx="32" ry="14" fill="white"/>
        </g>
        <g opacity="0.5">
          <ellipse cx="300" cy="85"  rx="44" ry="15" fill="white"/>
          <ellipse cx="318" cy="80"  rx="28" ry="13" fill="white"/>
        </g>

        <!-- Birds -->
        <g stroke="#6B8ECC" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.65">
          <path d="M400 135 Q406 129 412 135"/>
          <path d="M418 127 Q424 121 430 127"/>
          <path d="M435 138 Q441 132 447 138"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- ─── Right Form Panel ─── -->
  <div class="auth-panel">
    <div class="auth-form-wrap">
      <div class="auth-user-icon">👤</div>
      <h1 class="auth-title">Chào mừng trở lại</h1>
      <p class="auth-subtitle">Đăng nhập để quản lý cửa hàng giày của bạn</p>

      <div id="loginAlert" class="alert"></div>

      <form id="loginForm">
        <div class="auth-input-wrap">
          <span class="auth-input-icon">✉️</span>
          <input type="text" id="loginUsername" class="form-input-auth"
                 placeholder="Tên đăng nhập" required autocomplete="username">
        </div>

        <div class="auth-input-wrap">
          <span class="auth-input-icon">🔒</span>
          <input type="password" id="loginPassword" class="form-input-auth"
                 placeholder="Nhập mật khẩu" required autocomplete="current-password">
        </div>

        <div class="auth-remember">
          <label>
            <input type="checkbox" checked>
            Ghi nhớ đăng nhập
          </label>
          <a href="#">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn-auth" id="loginSubmitBtn">Đăng nhập</button>
      </form>

      <div class="auth-divider"><span>hoặc</span></div>

      <div class="auth-footer-link">
        Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
      </div>
    </div>

    <div class="auth-copyright">© 2025 Shoe Store Management System</div>
  </div>

</div>

<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
